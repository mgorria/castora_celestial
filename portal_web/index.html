<body data-access="checking" data-palette="patita">

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#inicio" aria-label="Oficina Castori, inicio"><span class="brand-seal">c<span>✦</span></span><span>oficina castori<small>LA CASTORA CELESTIAL</small></span></a>
    <div class="sidebar-line"></div>
    <p class="nav-label">TU PEQUEÑO UNIVERSO</p>

      <button data-view="library" class="nav-item"><svg><use href="#i-book"/></svg>La biblioteca</button>

  </aside>
  <div class="workspace">
